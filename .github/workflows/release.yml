# Builds, signs and checks the release APK, then drafts its GitHub release; the owner writes the notes and publishes it.
# The release key lives in the "release" environment, which only v* tags can use and which waits for the owner's
# approval. Run by hand on a v* tag, it does everything but the release: a dry run of the signing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  release:
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write # the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # Not "yes |": under pipefail, yes dies of a broken pipe once sdkmanager stops reading, failing the step.
          "$sdkmanager" --licenses < <(yes) > /dev/null
          "$sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "$ANDROID_HOME/build-tools/37.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: The tag names the version
        if: github.event_name == 'push'
        run: test "v$(grep -oP 'versionName = "\K[^"]+' build.gradle.kts)" = "$GITHUB_REF_NAME"
      - name: Release key
        env:
          P12: ${{ secrets.RELEASE_P12_BASE64 }}
          PASSWORD: ${{ secrets.RELEASE_PASSWORD_BASE64 }}
        run: |
          umask 077
          mkdir -p ~/.config/islauncher
          base64 -d <<< "$P12" > ~/.config/islauncher/release.p12
          base64 -d <<< "$PASSWORD" > ~/.config/islauncher/password
      - name: Build and check
        run: scripts/release.sh
      - name: Forget the key
        if: always()
        run: rm -f ~/.config/islauncher/release.p12 ~/.config/islauncher/password
      - name: Draft the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="islauncher-$version.apk"
          cd build
          sha256sum "$apk" > "$apk.sha256"
          cert=$(apksigner verify --print-certs "$apk" | sed -n 's/^V2 Signer: certificate SHA-256 digest: //p' | tr a-f A-F | sed 's/../&:/g; s/:$//')
          cat > notes.md <<EOF
          **New**

          - (to write before publishing)

          **Update:** open \`$apk\` on the phone and install it over the previous version. It is signed with the same key, so your home screen and settings stay. New here? See the [README](https://github.com/$GITHUB_REPOSITORY#install).

          **Verify the download:**

          - APK SHA-256: \`$(cut -d' ' -f1 "$apk.sha256")\`
          - Signing certificate SHA-256: \`$cert\`

          \`apkanalyzer manifest permissions $apk\` lists what the app can do, and INTERNET is not there.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Islauncher $version" --notes-file notes.md "$apk" "$apk.sha256"
